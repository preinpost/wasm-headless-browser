[workspace]
resolver = "2"
exclude = [
    "experiments/quickjs",
    "experiments/tls",
    "vendor/rquickjs-sys",
]

members = [
    "crates/cdp-wire",
    "crates/browser-core",
    "crates/engine-fake",
    "crates/engine",
    "crates/browser",
    "crates/client",
]

[workspace.package]
version = "0.0.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
cdp-wire = { path = "crates/cdp-wire" }
browser-core = { path = "crates/browser-core" }
engine-fake = { path = "crates/engine-fake" }
engine = { path = "crates/engine" }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

# QuickJS with our patches. See vendor/README.md.
[patch.crates-io]
rquickjs-sys = { path = "vendor/rquickjs-sys" }
