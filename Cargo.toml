[workspace]
resolver = "2"
members = [
    "crates/cdp-wire",
    "crates/browser-core",
    "crates/engine-fake",
    "crates/browser",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
cdp-wire = { path = "crates/cdp-wire" }
browser-core = { path = "crates/browser-core" }
engine-fake = { path = "crates/engine-fake" }
serde_json = "1"
sha1 = "0.10"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
