<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Real Page Fixture</title>
</head>
<body>
  <nav aria-label="Main">
    <a href="/">Home</a>
    <a href="/docs">Docs</a>
  </nav>
  <main>
    <h1>Real Page Fixture</h1>
    <p class="lead">This page is served over HTTP and parsed by the engine.</p>
    <form id="search" role="search">
      <label for="q">Search terms</label>
      <input id="q" type="text" name="q" placeholder="type here">
      <label for="pw">Password</label>
      <input id="pw" type="password" value="hunter2">
      <input type="checkbox" id="remember" checked>
      <label for="remember">Remember me</label>
      <button type="submit">Go</button>
    </form>
    <ul>
      <li>first item</li>
      <li>second item</li>
    </ul>
    <table>
      <tr><th scope="col">Name</th><th scope="col">Value</th></tr>
      <tr><td>alpha</td><td>1</td></tr>
    </table>
    <img src="x.png" alt="A described image">
    <div hidden>you should not see this</div>
    <button aria-label="Close dialog">×</button>
    <div id="scripted"></div>
    <script>
      // Proves the page's own script runs: the heading exists only if it did.
      const heading = document.createElement('h2');
      heading.textContent = 'Added by page script';
      document.getElementById('scripted').appendChild(heading);
      fixtureScriptRan = true;
    </script>
  </main>
</body>
</html>
