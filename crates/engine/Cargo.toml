[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The real engine: HTML parsing, an arena DOM, and an accessibility tree."

[dependencies]
browser-core.workspace = true
html5ever = "0.40"
markup5ever = "0.40"
serde_json.workspace = true
base64.workspace = true

# Only `std` (the default) and `bindgen`. `full-wasi` was used at first, but it
# pulls in `rquickjs-macro`, and the WASIX toolchain's rustc refuses to load
# that proc-macro (E0463, "can't find crate") even though cargo built it. The
# engine uses none of the macros, loaders or conversions that feature adds.
# `bindgen` is not optional, because rquickjs ships no pre-generated bindings
# for wasm32-wasmer-wasi and its fallback looks them up by exact target triple.
# See docs/quickjs.md.
rquickjs = { version = "0.14", features = ["bindgen"] }
