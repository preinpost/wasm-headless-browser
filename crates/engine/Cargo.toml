[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The real engine: HTML parsing, an arena DOM, and an accessibility tree."

[dependencies]
browser-core.workspace = true
html5ever = "0.40"
markup5ever = "0.40"
serde_json.workspace = true
base64.workspace = true

# `std` (the default), `bindgen`, and `loader` for ES modules (modules.rs),
# which adds only the pure-Rust `relative-path`. `full-wasi` was used at first, but it
# pulls in `rquickjs-macro`, and the WASIX toolchain's rustc refuses to load
# that proc-macro (E0463, "can't find crate") even though cargo built it. The
# engine uses none of the macros, loaders or conversions that feature adds.
# `bindgen` is not optional, because rquickjs ships no pre-generated bindings
# for wasm32-wasmer-wasi and its fallback looks them up by exact target triple.
# See docs/quickjs.md.
rquickjs = { version = "0.14", features = ["bindgen", "loader"] }

# TLS inside the guest. ring, not rustls's default aws-lc-rs, because ring is
# the backend the WASIX registry carries a fork of. See experiments/tls.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

# Box layout: block, flexbox and grid. Pure Rust. See layout.rs for what is
# approximated on top of it (inline flow, replaced elements, text).
taffy = { version = "0.14", default-features = false, features = ["std", "taffy_tree", "block_layout", "flexbox", "grid", "content_size", "float_layout", "calc"] }

# WHATWG URL parsing, for `URL`, `<script src>` and request URLs. Pure Rust.
url = "2"

# Character encodings, as the WHATWG Encoding standard defines them: page
# decoding (EUC-KR and the rest) and TextDecoder. Pure Rust; Firefox's. See
# encoding.rs.
encoding_rs = "0.8"

# Screenshots: glyph outlines rasterised from the embedded font (CFF included),
# and deflate for the PNG. Both pure Rust. See paint.rs and font.rs.
ab_glyph = "0.2"
miniz_oxide = "0.8"

# Images in screenshots and their intrinsic sizes in layout: PNG, JPEG, GIF
# and WebP, decoders only, all pure Rust. No SVG: that needs a renderer of
# its own. See images.rs.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
# Self-signed certificates for a local TLS server in the fetch tests.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
